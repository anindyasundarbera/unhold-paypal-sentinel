name: Build Astropods image

# Builds Dockerfile.astropods on GitHub's runners and publishes it to GHCR, so the
# Astropods blueprint can reference a prebuilt image (agent.image) and nobody needs
# Docker installed locally.
on:
  push:
    branches: [supabase-ledger, main]
    paths: ['src/**', 'public/**', 'package*.json', 'tsconfig.json', 'Dockerfile.astropods', 'astropods.yml', '.github/workflows/astropods-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.astropods
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/anindyasundarbera/unhold-paypal-sentinel:latest
            ghcr.io/anindyasundarbera/unhold-paypal-sentinel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
